name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly verification (fuzzing + full matrix).
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  # NOTE: there is intentionally no backend `go mod tidy` gate. Even with
  # GOWORK=off, tidying a backend module tries to resolve the root module's
  # test-only dependency (otel/sdk/metric, imported by
  # worker_store_error_test.go via the `replace tasuki => ../..` directive)
  # at the latest version, which requires a newer Go toolchain than CI pins.
  # Root-module tidiness is gated by #302 instead.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
      - name: Run staticcheck (root module)
        run: staticcheck ./...
      - name: Run staticcheck (backend modules)
        run: |
          for m in backend/sqlite backend/postgres backend/mysql backend/spanner backend/dynamodb backend/firestore; do
            (cd "$m" && staticcheck ./...)
          done

  vuln:
    # Advisory: stdlib findings track the auto-selected toolchain versus the
    # vulnerability database, so a hard gate would flap red on CVEs
    # unrelated to the PR (verified: 16 stdlib call-chain findings under the
    # current toolchain). Keep visible but non-blocking; promote to a hard
    # gate once the toolchain is pinned past the fixed versions.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
      - name: Run govulncheck (root module)
        run: govulncheck ./...
      - name: Run govulncheck (backend modules)
        if: always()
        run: |
          status=0
          for m in backend/sqlite backend/postgres backend/mysql backend/spanner backend/dynamodb backend/firestore; do
            (cd "$m" && govulncheck ./...) || status=$?
          done
          exit $status

  root:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tasuki
          POSTGRES_PASSWORD: tasuki
          POSTGRES_DB: tasuki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasuki -d tasuki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TASUKI_POSTGRES_DSN: postgres://tasuki:tasuki@localhost:5432/tasuki?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test root
        run: go test ./... -race -count=1 -timeout 10m

  backend-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test sqlite
        working-directory: backend/sqlite
        run: go test ./... -race -count=1 -timeout 120s

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tasuki
          POSTGRES_PASSWORD: tasuki
          POSTGRES_DB: tasuki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasuki -d tasuki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TASUKI_POSTGRES_DSN: postgres://tasuki:tasuki@localhost:5432/tasuki?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test postgres
        working-directory: backend/postgres
        run: go test ./... -race -count=1 -timeout 120s

  backend-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: tasuki
          MYSQL_PASSWORD: tasuki
          MYSQL_DATABASE: tasuki
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utasuki -ptasuki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TASUKI_MYSQL_DSN: tasuki:tasuki@tcp(127.0.0.1:3306)/tasuki?parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test mysql
        working-directory: backend/mysql
        run: go test ./... -race -count=1 -timeout 180s

  backend-spanner:
    runs-on: ubuntu-latest
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.41
        ports:
          - 9010:9010
          - 9020:9020
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
      TASUKI_SPANNER_DSN: projects/tasuki/instances/tasuki/databases/tasuki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Wait for Spanner emulator
        run: |
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/9010) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          echo "spanner emulator not ready" >&2
          exit 1
      - name: Test spanner
        working-directory: backend/spanner
        run: go test ./... -race -count=1 -timeout 180s

  backend-dynamodb:
    runs-on: ubuntu-latest
    env:
      TASUKI_DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Start DynamoDB Local
        run: |
          docker run -d --name dynamodb -p 8000:8000 amazon/dynamodb-local:2.5.2 \
            -jar DynamoDBLocal.jar -sharedDb -inMemory
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8000/ >/dev/null 2>&1; then exit 0; fi
            # DynamoDB Local may return non-200 on /; accept open port
            if (echo >/dev/tcp/127.0.0.1/8000) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs dynamodb || true
          exit 1
      - name: Test dynamodb
        working-directory: backend/dynamodb
        run: go test ./... -race -count=1 -timeout 180s

  backend-firestore:
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8086
      TASUKI_FIRESTORE_PROJECT: tasuki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore -p 8086:8086 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8086
          for i in $(seq 1 90); do
            if (echo >/dev/tcp/127.0.0.1/8086) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs firestore || true
          exit 1
      - name: Test firestore
        working-directory: backend/firestore
        run: go test ./... -race -count=1 -timeout 180s

  chaos-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tasuki
          POSTGRES_PASSWORD: tasuki
          POSTGRES_DB: tasuki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasuki -d tasuki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TASUKI_POSTGRES_DSN: postgres://tasuki:tasuki@localhost:5432/tasuki?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Chaos postgres
        run: go test ./chaos/ -run 'TestChaos_KillWorkers$' -race -count=1 -timeout 5m

  chaos-mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: tasuki
          MYSQL_PASSWORD: tasuki
          MYSQL_DATABASE: tasuki
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -utasuki -ptasuki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TASUKI_MYSQL_DSN: tasuki:tasuki@tcp(127.0.0.1:3306)/tasuki?parseTime=true&loc=UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Chaos mysql
        run: go test ./chaos/ -run TestChaos_KillWorkers_MySQL -race -count=1 -timeout 5m

  chaos-spanner:
    runs-on: ubuntu-latest
    services:
      spanner:
        image: gcr.io/cloud-spanner-emulator/emulator:1.5.41
        ports:
          - 9010:9010
          - 9020:9020
    env:
      SPANNER_EMULATOR_HOST: localhost:9010
      TASUKI_SPANNER_DSN: projects/tasuki/instances/tasuki/databases/tasuki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Wait for Spanner emulator
        run: |
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/9010) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Chaos spanner
        run: go test ./chaos/ -run TestChaos_KillWorkers_Spanner -race -count=1 -timeout 5m

  chaos-dynamodb:
    runs-on: ubuntu-latest
    env:
      TASUKI_DYNAMODB_ENDPOINT: http://127.0.0.1:8000
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Start DynamoDB Local
        run: |
          docker run -d --name dynamodb -p 8000:8000 amazon/dynamodb-local:2.5.2 \
            -jar DynamoDBLocal.jar -sharedDb -inMemory
          for i in $(seq 1 60); do
            if (echo >/dev/tcp/127.0.0.1/8000) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs dynamodb || true
          exit 1
      - name: Chaos dynamodb
        run: go test ./chaos/ -run TestChaos_KillWorkers_DynamoDB -race -count=1 -timeout 5m

  chaos-firestore:
    runs-on: ubuntu-latest
    env:
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8086
      TASUKI_FIRESTORE_PROJECT: tasuki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Start Firestore emulator
        run: |
          docker run -d --name firestore -p 8086:8086 \
            gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators \
            gcloud beta emulators firestore start --host-port=0.0.0.0:8086
          for i in $(seq 1 90); do
            if (echo >/dev/tcp/127.0.0.1/8086) >/dev/null 2>&1; then exit 0; fi
            sleep 1
          done
          docker logs firestore || true
          exit 1
      - name: Chaos firestore
        run: go test ./chaos/ -run TestChaos_KillWorkers_Firestore -race -count=1 -timeout 5m

  chaos-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Chaos sqlite
        run: go test -tags tasuki_all ./chaos/ -run TestChaos_KillWorkers_SQLite -race -count=1 -timeout 5m

  cover:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tasuki
          POSTGRES_PASSWORD: tasuki
          POSTGRES_DB: tasuki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasuki -d tasuki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TASUKI_POSTGRES_DSN: postgres://tasuki:tasuki@localhost:5432/tasuki?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Cover root
        run: go test ./... -coverprofile=cover.out -count=1 -timeout 10m
      - name: Summary
        if: always()
        run: |
          {
            echo '### Coverage (root module)'
            echo '```'
            if [ -f cover.out ]; then
              go tool cover -func=cover.out | grep -Ev 'examples/|/cmd/|backendtest/' || true
              echo
              go tool cover -func=cover.out | tail -1
            else
              echo 'cover.out missing'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cover-out
          path: cover.out
          if-no-files-found: ignore

  gowork-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Independent build without workspace (no hidden deps)
        run: |
          GOWORK=off GOPROXY=off go list ./... > /dev/null
          GOWORK=off go build ./...
      - name: Minimal Go version with local toolchain
        run: GOTOOLCHAIN=local go build ./...
      - name: Full workspace build with all backends
        run: go build -tags tasuki_all ./...
      - name: Test contrib and examples with all backends
        run: go test -tags tasuki_all ./contrib/... ./examples/...

  fuzz-nightly:
    # Runs only on schedule / manual dispatch: ~60s of fuzzing per target.
    # Fuzz seed corpora run as ordinary unit tests in the `root` job on every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Fuzz codec JSON round-trip (60s)
        run: go test -fuzz=FuzzJSONRoundTrip -fuzztime 60s ./codec/
      - name: Fuzz codec encrypted round-trip (60s)
        run: go test -fuzz=FuzzEncryptedRoundTrip -fuzztime 60s ./codec/
      - name: Fuzz codec encrypted garbage (60s)
        run: go test -fuzz=FuzzEncryptedGarbage -fuzztime 60s ./codec/
      - name: Fuzz engine synthetic journal (60s)
        run: go test -fuzz=FuzzRunSyntheticJournal -fuzztime 60s ./internal/engine/
