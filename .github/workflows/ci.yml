name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tasuki
          POSTGRES_PASSWORD: tasuki
          POSTGRES_DB: tasuki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tasuki -d tasuki"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      TASUKI_POSTGRES_DSN: postgres://tasuki:tasuki@localhost:5432/tasuki?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - name: Test root
        run: go test ./... -race -count=1
      - name: Test postgres backend
        run: go test ./... -count=1 -timeout 120s
        working-directory: backend/postgres
      - name: Chaos
        run: go test ./chaos/ -count=1 -timeout 120s
