services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tasuki
      POSTGRES_PASSWORD: tasuki
      POSTGRES_DB: tasuki
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasuki -d tasuki"]
      interval: 2s
      timeout: 5s
      retries: 15
