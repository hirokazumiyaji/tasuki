services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tasuki
      POSTGRES_PASSWORD: tasuki
      POSTGRES_DB: tasuki
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasuki -d tasuki"]
      interval: 2s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_USER: tasuki
      MYSQL_PASSWORD: tasuki
      MYSQL_DATABASE: tasuki
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utasuki", "-ptasuki"]
      interval: 2s
      timeout: 5s
      retries: 30
