services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tasuki
      POSTGRES_PASSWORD: tasuki
      POSTGRES_DB: tasuki
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasuki -d tasuki"]
      interval: 2s
      timeout: 5s
      retries: 15

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_USER: tasuki
      MYSQL_PASSWORD: tasuki
      MYSQL_DATABASE: tasuki
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-utasuki", "-ptasuki"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Single-node TiDB with unistore (local verification; MySQL protocol on :4000).
  tidb:
    image: pingcap/tidb:v8.5.1
    command:
      - --store=unistore
      - --path=/tmp/tidb
      - --advertise-address=127.0.0.1
    ports:
      - "4000:4000"

  # Cloud Spanner emulator (gRPC :9010, REST :9020).
  spanner:
    image: gcr.io/cloud-spanner-emulator/emulator:1.5.41
    ports:
      - "9010:9010"
      - "9020:9020"

  # DynamoDB Local (in-memory shared DB on :8000).
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "8000:8000"

  # Firestore emulator (gcloud).
  firestore:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: ["gcloud", "beta", "emulators", "firestore", "start", "--host-port=0.0.0.0:8086"]
    ports:
      - "8086:8086"
